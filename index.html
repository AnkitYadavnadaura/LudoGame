<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoJS Tutorial</title>
    <style>
   

.dice-box img{
    width:60px;
    height:60px;
    transition: transform 0.2s;
}

.roll{
    animation: shake 0.4s infinite;
}

@keyframes shake{
    0%{ transform: rotate(0deg); }
    25%{ transform: rotate(20deg); }
    50%{ transform: rotate(-20deg); }
    75%{ transform: rotate(10deg); }
    100%{ transform: rotate(0deg); }
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:18px;
}
</style>
    <link rel="stylesheet" href="style.css">
</head>
<body><div style="display: none;" class="row">
                <button id="dice-btn" class="btn btn-dice">Roll</button>
                <div class="dice-value"></div>
                <button id="reset-btn" class="btn btn-reset">Reset</button>
            </div>
           
    <div class="ludo-container">
        <div class="row">
                <div onclick="rollDice(3)" class="dice-box">
    <img onclick="rollDice(3)" id="dice3" src="dice/image1.png">
</div>
                <div class="dice-value"></div>
                <div onclick="rollDice(4)" class="dice-box">
    <img onclick="rollDice(4)" id="dice4" src="dice/image1.png">
</div>
            </div>
        <div class="ludo">
            <div class="player-pieces">
                <div class="player-piece" player-id="P1" piece="0"></div>
                <div class="player-piece" player-id="P1" piece="1"></div>
                <div class="player-piece" player-id="P1" piece="2"></div>
                <div class="player-piece" player-id="P1" piece="3"></div>
                
                <div class="player-piece" player-id="P2" piece="0"></div>
                <div class="player-piece" player-id="P2" piece="1"></div>
                <div class="player-piece" player-id="P2" piece="2"></div>
                <div class="player-piece" player-id="P2" piece="3"></div>
            </div>

            <div class="player-bases">
                <div class="player-base" player-id="P1"></div>
                <div class="player-base" player-id="P2"></div>
            </div>
        </div>
        <div class="footer">
            <div class="row">
                <div onclick="rollDice(1)" class="dice-box">
    <img onclick="rollDice(1)" id="dice1" src="dice/image1.png">
</div>
                <div class="dice-value"></div>
                <div onclick="rollDice(2)" class="dice-box">
    <img onclick="rollDice(2)" id="dice2" src="dice/image1.png">
</div>
            </div>
            <h2 class="active-player">Active Player: <span></span> </h2>
        </div>
    </div>

    <script src="./main.js" type="module"></script>


<script>

let rolling = false;
let activePlayer = document.querySelector(".active-player span");
let playerCount = 2;
let btn1 = document.querySelector("#dice-btn")

function rollDice(playerId){
    let dice = document.getElementById("dice"+playerId);
    console.log(dice)
    console.log(activePlayer.textContent.toLowerCase(), "p"+playerId)
    if(playerCount == 2){
        if(playerId == 4){
            playerId = 2;
        } 
    }


    if(rolling) return;
    rolling = true;
    if(("p"+playerId) !== activePlayer.textContent.toLowerCase()){
        rolling = false;
        return;
    }
    console.log("Player "+playerId+" rolled the dice!");
    btn1.click();

    //dice.classList.add("roll");

    let rollCount = 0;

    let interval = setInterval(() => {

        let randomFace = Math.floor(Math.random()*8)+1;
        dice.parentElement.innerHTML = `<img id="dice${playerId}" src="dice/dice${randomFace}.png"/>`

        rollCount++;

        // 15 fast changes = realistic rolling
        if(rollCount > 30){

            clearInterval(interval);

            let final = parseInt(document.querySelector(".dice-value").textContent) || 1;
            dice.src = "dice/image"+final+".png";

            dice.classList.remove("roll");
            rolling = false;

            console.log("Final Dice:", final);
        }

    }, 10); // speed (lower = faster roll)
}
</script>
</body>

</html>
